spring.config.import=optional:file:.env[.properties]

# ===============================
# SQL SERVER DATASOURCE
# ===============================
# Chọn 1 trong 2: comment dòng không dùng

# AWS (RDS)
# spring.datasource.url=jdbc:sqlserver://backend-sqlserver.c1q8k4w82nhu.ap-southeast-2.rds.amazonaws.com:1433;databaseName=JournalTrendDB;encrypt=true;trustServerCertificate=true;

# Local (Docker)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=JournalTrendDB;encrypt=false;trustServerCertificate=true;

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# HikariCP connection pool optimization
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
# Keep connections alive — critical for Docker SQL Server
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Leak detection helps find stuck connections
spring.datasource.hikari.leak-detection-threshold=30000

# Batch fetching — reduces N+1 queries over slow network
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable OSIV — avoids holding JPA connections during slow non-JPA operations (e.g. Neo4j, external APIs)
spring.jpa.open-in-view=false

# ===============================
# NEO4J CONFIG
# ===============================
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.neo4j.database=${NEO4J_DATABASE:neo4j}
spring.neo4j.connection-timeout=10s
spring.neo4j.max-transaction-retry-time=15s
# In log Cypher để dễ debug đồ án
logging.level.org.springframework.data.neo4j=INFO
server.forward-headers-strategy=framework
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ===============================
# MAIL CONFIG (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# CACHE CONFIG (Caffeine)
# ===============================
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=1h,maximumSize=500,recordStats

# ===============================
# APP CONFIG
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwtExpirationInMs=${JWT_EXPIRATION:86400000}
app.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION:604800000}
app.reset-token-expiration-ms=${RESET_TOKEN_EXPIRATION:900000}
app.verification-token-expiration-ms=${VERIFICATION_TOKEN_EXPIRATION:86400000}
app.core-api-key=${CORE_API_KEY:}
# Auto-sync startup & hourly (false = tắt để không bị chậm khi dev)
app.auto-sync-enabled=${APP_AUTO_SYNC_ENABLED:true}
# OpenAlex API key — REQUIRED since Feb 2026 (the old mailto polite pool is deprecated)
# Get your free key at https://openalex.org/settings/api
app.openalex-api-key=${OPENALEX_API_KEY:}
# Deprecated — kept for backward compatibility but no longer works for auth
app.openalex-email=${OPENALEX_EMAIL:}
app.google-client-id=${GOOGLE_CLIENT_ID:}

# DeepSeek AI — powers keyword expansion, summarization, methodology extraction, and batch analysis.
# When DEEPSEEK_API_KEY is empty, all AI features gracefully fall back to null / local expansion.
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.ai-box.vn/v1/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}

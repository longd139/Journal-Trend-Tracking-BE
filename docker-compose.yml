# ===============================
# SCITRACK — Local Dev
# docker compose up -d
# ===============================
# SQL Server: cài local trên máy (không cần docker)
# Neo4j: chạy trong Docker

services:
  # ---- Neo4j Community Edition ----
  neo4j:
    image: neo4j:5.26-community
    container_name: scitrack-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/7687' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---- Spring Boot App ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scitrack-api
    environment:
      # SQL Server — cài local, connect qua host.docker.internal
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: "1433"
      DATABASE_NAME: ${DATABASE_NAME:-JournalTrendDB}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-YourStrong!Passw0rd}

      # Neo4j — Local Docker
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      NEO4J_DATABASE: neo4j

      # Other services (optional)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      APP_AUTO_SYNC_ENABLED: ${APP_AUTO_SYNC_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # JVM tuning
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
